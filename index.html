<script id="mobile-landscape-collapse">
/* =========================================================================
   手机横屏：自动折叠手势面板
   原因：框架只在「窄屏」自动折叠 gesture-control，而横屏手机宽 844~915px
         (>768) 被判为宽屏 → 面板保持展开态（实测 368x185），
         在只有 390~412px 高的屏幕里吃掉近一半面积，挡住战甲。
   做法：仅在「横屏且视口高<=480px」时，程序化触发它自己的折叠按钮；
         用户仍可随时手动点 EXPAND 展开，不做强制锁定。
   ========================================================================= */
(function () {
  var MQ = '(orientation: landscape) and (max-height: 480px)';

  function collapseGesturePanel() {
    try {
      if (!window.matchMedia(MQ).matches) return;
      var panel = document.querySelector('.gesture-control');
      if (!panel) return;
      if (panel.classList.contains('is-collapsed')) return; // 已折叠，别点了（会反向展开）
      var btn = panel.querySelector('.gesture-control__collapse-btn');
      if (btn) btn.click();
    } catch (e) {}
  }

  function schedule() { setTimeout(collapseGesturePanel, 350); }

  window.addEventListener('orientationchange', schedule);
  window.addEventListener('resize', schedule);
  window.addEventListener('load', function () { setTimeout(collapseGesturePanel, 1000); });

  // 面板由 React 异步挂载，前 15 秒轮询兜底（之后自动停止，不留常驻定时器）
  var tries = 0;
  var timer = setInterval(function () {
    collapseGesturePanel();
    if (++tries > 20) clearInterval(timer);
  }, 750);
})();
</script>
